<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Inline & Block</title>
	<style>
		body{
			font-family: sans-serif;
			font-size: 20px;
			line-height: 150%;
			margin: 5rem;
		}
		div{
			border: 1px solid red;
			padding: 1rem;
		}
		span{
			border-bottom: 1px solid purple;
		}
	</style>

</head>
<body>
	<div>
	Lorem, ipsum dolor sit amet consectetur adipisicing elit.
	<span>
		Blanditiis doloribus ducimus magni nobis, vero,
		itaque rerum fuga sint eum sequi repudiandae illum tenetur quisquam?
	</span>
	Explicabo facere exercitationem odit quasi dolores!
	</div>

</body>
</html>
